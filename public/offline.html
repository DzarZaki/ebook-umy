<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak Ada Koneksi &middot; Pustaka Dosen</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #faf9f7; color: #292524; padding: 2rem;
            font-family: Karla, system-ui, sans-serif;
        }
        .kotak { max-width: 26rem; text-align: center; }
        img { width: 64px; height: 64px; }
        h1 { font-family: Georgia, serif; font-size: 1.6rem; margin: 1.25rem 0 .5rem; }
        p { color: #57534d; line-height: 1.6; font-size: .95rem; margin: 0 0 1.5rem; }
        button {
            background: #dd5a0b; color: #fff; border: 0; padding: .7rem 1.4rem;
            font: inherit; font-weight: 600; cursor: pointer; border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="kotak">
        <img src="/images/logo.svg" alt="">
        <h1>Tidak ada koneksi internet</h1>
        <p>
            Halaman ini belum tersimpan di perangkat Anda. Sambungkan kembali
            ke internet, lalu coba muat ulang.
        </p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
